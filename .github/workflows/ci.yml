name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-chat-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ai-chat-client/package-lock.json
      - run: npm ci
      - run: npm run privacy:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
